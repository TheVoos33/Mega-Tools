# Forge mod metadata. Gradle's generateModMetadata task fills in the placeholders from gradle.properties
# (minecraft_version_range, forge_version_range, loader_version_range, mod_id, mod_name, mod_license, mod_version).
# Every dollar-brace sequence is treated as a placeholder, even inside comments.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="TheVoos"
description='''Paxels and the Mega Tool: every tool in one, with wrench storage, tool auto-swap, enchantment plates and a light slot.'''
# (Mixins are listed in the jar manifest: MixinConfigs, see build.gradle.)

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
