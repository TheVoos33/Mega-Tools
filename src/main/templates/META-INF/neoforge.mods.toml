# Mod metadata template. Gradle's generateModMetadata task replaces each placeholder below with the
# matching value from gradle.properties and writes the real file to build/generated/sources/modMetadata.
# Note: every dollar-brace sequence in this file is treated as a placeholder, even inside comments.
# Only these placeholders are available (they're the ones build.gradle passes in):
#   minecraft_version, minecraft_version_range, neo_version, 
#   mod_id, mod_name, mod_license, mod_version

license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="TheVoos"
description='''Paxels and the Mega Tool: every tool in one, with wrench storage, tool auto-swap, enchantment plates and a light slot.'''
# Adds the Mega Tool's third-person arm pose (see client/MegaToolArmPose.java). Required.
enumExtensions="META-INF/enumextensions.json"

# Client: the swap key in the tool GUI comes before recipe viewers (EMI)
[[mixins]]
config="${mod_id}.mixins.json"

# Optional compat with other mods (PickleTweaks grid repair): does nothing without them
[[mixins]]
config="${mod_id}.compat.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
